name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build all packages
        run: npm run build
      - name: Package artifacts
        run: |
          tar -czf expense-tracker-${{ github.ref_name }}.tar.gz apps packages package.json package-lock.json README.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: expense-tracker-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
