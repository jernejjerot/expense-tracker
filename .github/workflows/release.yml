name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependency-container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency and filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.25.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  policy-as-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Policy-as-code scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          framework: github_actions,dockerfile,secrets
          quiet: true
          output_format: sarif
          output_file_path: reports/results.sarif
      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/results.sarif

  release:
    runs-on: ubuntu-latest
    needs: [sast, dependency-container-scan, secret-scan, policy-as-code]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build all packages
        run: npm run build
      - name: Package artifacts
        run: |
          tar -czf expense-tracker-${{ github.ref_name }}.tar.gz apps packages package.json package-lock.json README.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: expense-tracker-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
