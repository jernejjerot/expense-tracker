name: Deploy Staging

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  STAGING_HEALTH_URL: https://httpbin.org/status/200

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Package build artifact
        run: tar -czf build-artifact.tar.gz apps packages package.json package-lock.json README.md
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build-artifact.tar.gz

  provision-infra:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform (IaC)
        uses: hashicorp/setup-terraform@v3
      - name: Terraform plan signal
        run: |
          terraform version
          echo "terraform init"
          echo "terraform plan -out=tfplan"
          echo "bicep build infra/main.bicep"

  sast:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependency-container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency and filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.25.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  policy-as-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Policy-as-code scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          framework: github_actions,dockerfile,secrets
          quiet: true
          output_format: sarif
          output_file_path: reports/results.sarif
      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/results.sarif

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build, provision-infra, sast, dependency-container-scan, secret-scan, policy-as-code]
    environment:
      name: staging
      url: https://httpbin.org/status/200
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
      - name: Deploy to staging platform
        run: |
          echo "az webapp deploy --resource-group rg-demo --name expense-tracker-staging --src-path build-artifact.tar.gz"
          echo "kubectl apply -f k8s/deployment.yaml"
      - name: Safe deploy command flow
        run: bash scripts/safe-deploy.sh

  validate-staging:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Health check
        id: health
        run: |
          curl -fsSL "${STAGING_HEALTH_URL}" > /dev/null
          bash scripts/health-check.sh "${STAGING_HEALTH_URL}"
      - name: Rollback on failure
        if: failure() && steps.health.outcome == 'failure'
        run: |
          echo "kubectl rollout undo deployment/expense-tracker -n staging"
          bash scripts/rollback.sh
