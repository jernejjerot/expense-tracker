name: Deploy Staging

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  STAGING_HEALTH_URL: https://httpbin.org/status/200

jobs:
  sast:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependency-container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Dependency and filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.25.0
        with:
          scan-type: fs
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  policy-as-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Policy-as-code scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          framework: github_actions,dockerfile,secrets
          quiet: true
          output_format: sarif
          output_file_path: reports/results.sarif
      - name: Upload Checkov SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/results.sarif

  deploy:
    runs-on: ubuntu-latest
    needs: [sast, dependency-container-scan, secret-scan, policy-as-code]
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Safe deploy command flow
        run: bash scripts/safe-deploy.sh
      - name: Health check
        id: health
        run: bash scripts/health-check.sh "${STAGING_HEALTH_URL}"
      - name: Rollback on failure
        if: failure() && steps.health.outcome == 'failure'
        run: bash scripts/rollback.sh
