[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "expense-tracker-analyzer-demo"
version = "0.1.0"
description = "Structured CLI expense tracker for repository analysis platform testing"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Project1 Team" }
]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
  "ruff>=0.5.0"
]

[project.scripts]
expense-tracker = "expense_tracker.interface.cli:main"
expense-tracker-web = "expense_tracker.interface.web:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/expense_tracker"]
